[package]
name = "svmgov_program"
version = "0.3.0-40000"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "svmgov_program"

[features]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"]}
ncn-snapshot = { path = "../../../../ncn/programs/ncn-snapshot", features = ["cpi"] }
solana-program = "3.0.0"
#solana-keypair = "=3.0.0"
#solana-vote = { version = "3.0.0", features = []}

#solana-vote-interface = { version = "4.0.4", default-features = false, features = ["bincode"] }
solana-stake-interface = "3.0.0"
solana-vote-interface = { version = "5.1.1", default-features = false, features = ["bincode"] }